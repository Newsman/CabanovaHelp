# La fiecare push pe main: Hugo construiește site-ul, Pagefind face indexul de căutare, GitHub Pages îl publică.
name: Publicare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - run: cp public/ro/404.html public/404.html && npx -y pagefind@1.6.0 --site public
      - name: Verificare white label
        run: "! grep -rIil 'site\\.pro' public content layouts assets"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
